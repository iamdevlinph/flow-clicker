name: Pockie v21 native sidebar POC

on:
  push:
    branches: [chatgpt/pockie-v21-native-sidebar]
    paths:
      - '.pockie-poc/**'
      - '.github/workflows/pockie-v21-poc.yml'
  pull_request:
    branches: [main]
    paths:
      - '.pockie-poc/**'
      - '.github/workflows/pockie-v21-poc.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory .pockie-poc/packages -ExcludeVersion -NonInteractive
      - name: Build native POC
        shell: pwsh
        run: |
          $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $compile = 'cl /nologo /EHsc /std:c++17 /O2 /DUNICODE /D_UNICODE /I ".pockie-poc\packages\Microsoft.Web.WebView2\build\native\include" ".pockie-poc\main.cpp" /Fe:"PockieClickerPOC_v21_native_sidebar.exe" /link /SUBSYSTEM:WINDOWS ".pockie-poc\packages\Microsoft.Web.WebView2\build\native\x64\WebView2LoaderStatic.lib" dcomp.lib ole32.lib user32.lib gdi32.lib shell32.lib advapi32.lib'
          cmd /c "`"$devcmd`" -arch=x64 && $compile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect binary
        shell: pwsh
        run: |
          if (!(Test-Path .\PockieClickerPOC_v21_native_sidebar.exe)) { throw 'EXE missing' }
          $f = Get-Item .\PockieClickerPOC_v21_native_sidebar.exe
          Write-Host "Built $($f.FullName) size=$($f.Length)"
          Get-FileHash .\PockieClickerPOC_v21_native_sidebar.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: PockieClickerPOC-v21-native-sidebar
          path: PockieClickerPOC_v21_native_sidebar.exe
          if-no-files-found: error
